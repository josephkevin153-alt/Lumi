<!DOCTYPE html>
<html lang="id" data-theme="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="LUMI — Personal Academic Planner untuk siswa SMA">
<title>LUMI — Academic Planner · by josephkevin._</title>

<!--
  =====================================================================
  LUMI — Personal Academic Planner (versi 1, satu file)
  by josephkevin._
  ---------------------------------------------------------------------
  Struktur kode (mudah dikembangkan jadi PWA / APK Capacitor):
    1. CSS ........ tema lewat CSS variable (data-theme di <html>)
    2. HTML ....... kerangka kosong; semua tampilan dirender oleh JS
    3. JS:
       - Konfigurasi & data statis (jenis kegiatan, mapel, jadwal)
       - Helper tanggal (semua tanggal = string "YYYY-MM-DD" lokal)
       - Storage ..... satu-satunya tempat membaca/menulis localStorage
       - Planner ..... mesin rekomendasi (berbasis aturan, bisa diganti AI API)
       - Notifier .... adapter notifikasi (browser sekarang, Capacitor nanti)
       - View ........ fungsi render per halaman
       - Aksi/Event .. satu event listener (delegasi) untuk semua tombol
  =====================================================================
-->

<style>
/* ===================== 1. TEMA & DASAR ===================== */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F6F5F7;
  --ink:#37343D; --ink-soft:#8E8A96; --line:#EDEBF0;
  --primary:#9CC3EE; --on-primary:#12304F; --primary-ink:#2F6DB5; --primary-soft:#E4EFFB;
  --sage:#CFE0CC; --sage-ink:#4D6A4B; --lav:#E3DAF3; --lav-ink:#5D4D8A;
  --danger-bg:#FBDADA; --danger-ink:#8A2F3A;
  --shadow:0 1px 6px rgba(60,50,70,.06);
  --radius:20px;
}
:root[data-theme="blue"]{
  --bg:#F2F7FD; --soft:#E5EEFA; --line:#D9E5F4;
  --primary:#3D7FCB; --on-primary:#FFFFFF; --primary-ink:#2B66AE; --primary-soft:#DCE9FA;
}
:root[data-theme="sage"]{
  --bg:#F0F5EE; --soft:#E3EDDF; --line:#DCE7D8;
  --primary:#A9CBA5; --on-primary:#29432A; --primary-ink:#4D7A4B; --primary-soft:#DDEBDA;
}
:root[data-theme="lavender"]{
  --bg:#F4F0FB; --soft:#E9E2F6; --line:#E3DBF1;
  --primary:#C7B7EA; --on-primary:#33255C; --primary-ink:#6A55A8; --primary-soft:#E6DEF6;
}
:root[data-theme="night"]{
  --bg:#26232E; --surface:#312D3B; --soft:#3B3646;
  --ink:#F2EEF8; --ink-soft:#A8A2B5; --line:#443F50;
  --primary:#8FB8EA; --on-primary:#10263F; --primary-ink:#A9CBF5; --primary-soft:#2F3F57;
  --sage:#3E4B3E; --sage-ink:#BFDDBB; --lav:#3F3955; --lav-ink:#CFC2F0;
  --danger-bg:#4D2B33; --danger-ink:#F2B5BE;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.45;transition:background .3s,color .3s;
  -webkit-text-size-adjust:100%;
}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
.ico{display:block;flex:none}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.hidden{display:none!important}

/* ===================== KOMPONEN UMUM ===================== */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:12px;transition:background .3s}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:16px;margin-bottom:10px}
.card-title .link{font-size:13px;font-weight:700;color:var(--primary-ink);background:none;border:0;padding:4px 0;cursor:pointer}
.page-title{font-size:26px;font-weight:800;margin:4px 0 14px;letter-spacing:-.3px}
.btn{border:0;border-radius:14px;padding:11px 16px;min-height:44px;font-weight:700;background:var(--soft);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--danger-bg);color:var(--danger-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:999px;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:800}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--tagbg,#EEE);color:#3F3A45;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink-soft)}
.badge.pen{background:#FBEFC8;color:#7A5F10}
.badge.sp{background:#FBDADA;color:#9B2C2C}
.badge.late{background:var(--danger-bg);color:var(--danger-ink)}
:root[data-theme="night"] .badge.pen{background:#4D4527;color:#F2DE93}
:root[data-theme="night"] .badge.sp{background:#573035;color:#F5BCC0}
.empty{text-align:center;padding:22px 12px;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .art{width:64px;height:64px;margin:0 auto 8px;opacity:.9}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);margin:16px 0 8px;letter-spacing:.2px}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;min-height:46px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--primary)}
textarea.field{resize:vertical;min-height:80px}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger-ink);background:var(--danger-bg);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}

/* ===================== NAVIGASI ===================== */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;border-radius:24px 24px 0 0;box-shadow:0 -4px 18px rgba(110,80,70,.07);transition:background .3s}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-soft);padding:4px 0;border-radius:14px;cursor:pointer}
.nav button .wrap{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.nav button.on{color:var(--primary-ink)}
.nav button.on .wrap{background:var(--primary-soft)}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 224px));width:56px;height:56px;border-radius:20px;border:0;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(60,120,200,.32);cursor:pointer;z-index:25;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ===================== SHEET, DIALOG, TOAST ===================== */
.overlay{position:fixed;inset:0;background:rgba(45,32,45,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.overlay.open .sheet{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sheet-head h2{font-size:20px;font-weight:800}
.sheet-grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet-actions .btn{flex:1}
#dialog{z-index:60;display:flex;align-items:center;justify-content:center}
.dialog{background:var(--surface);border-radius:24px;padding:22px 20px 16px;width:calc(100% - 40px);max-width:340px;transform:scale(.94);transition:transform .2s;box-shadow:var(--shadow)}
#dialog.open .dialog{transform:none}
.dialog h3{font-size:18px;font-weight:800;margin-bottom:6px}
.dialog p{color:var(--ink-soft);margin-bottom:16px}
.dialog .sheet-actions{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:calc(100% - 40px);text-align:center}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-undo{border:0;background:var(--primary);color:var(--on-primary);font-weight:800;border-radius:999px;padding:6px 14px;cursor:pointer}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===================== HOME ===================== */
.hero{position:relative;padding:4px 2px 8px;margin-bottom:12px}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.credit{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:2px;color:var(--primary-ink)}
.pill{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;color:var(--ink-soft);border:1px solid var(--line)}
.hero h1{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.hero .date{color:var(--ink-soft);font-weight:700;margin-top:2px}
.hero .sum{margin-top:10px;font-size:14px}
.lesson-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lesson-chips span{background:var(--soft);border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stats .card{margin:0;display:flex;flex-direction:column;justify-content:center}
.stat-num{font-size:34px;font-weight:900;line-height:1;color:var(--primary-ink)}
.stat-lbl{font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.ring{width:84px;height:84px;margin:0 auto}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:9}
.ring-fg{fill:none;stroke:var(--primary-ink);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-t{font-size:17px;font-weight:900;fill:var(--ink)}
.near{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.near:first-of-type{border-top:0}
.near .dot{width:10px;height:10px;border-radius:50%;flex:none}
.near .t{font-weight:800}
.near .s{font-size:13px;color:var(--ink-soft)}
.near .r{margin-left:auto;font-weight:800;color:var(--primary-ink);font-size:13px;white-space:nowrap}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:2px 0 12px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .5s}
.rem{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.rem .ic{width:34px;height:34px;border-radius:12px;background:var(--primary-soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;flex:none}
.sug{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sug:first-of-type{border-top:0}
.sug b{font-weight:800}

/* ===================== KARTU KEGIATAN ===================== */
.act{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:opacity .2s}
.act.done{opacity:.6}
.act.done .act-title{text-decoration:line-through}
.act.compact{box-shadow:none;background:var(--bg)}
.check{width:28px;height:28px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:transparent;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:all .18s;padding:0;margin-top:2px}
.check.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.act-main{flex:1;min-width:0}
.act-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.act-title{font-weight:800;font-size:15.5px}
.act-detail{font-size:13.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-line}
.act-meta{font-size:12.5px;color:var(--ink-soft);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sec-title{font-size:13px;font-weight:800;color:var(--ink-soft);margin:14px 2px 8px;letter-spacing:.3px}

/* ===================== KALENDER ===================== */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:11px;font-weight:800;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}
.seg .cnt{font-size:11px;opacity:.85;margin-left:3px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.cal-head h2{font-size:18px;font-weight:800}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:11.5px;font-weight:800;color:var(--ink-soft);text-align:center;margin-bottom:4px}
.cal-cell{aspect-ratio:1/1.08;border:0;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;cursor:pointer;font-weight:700;font-size:14px;position:relative}
.cal-cell.blank{pointer-events:none}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-cell.exam{background:#FBE3CC;color:#7A4A12}
.cal-cell.sel{background:var(--primary);color:var(--on-primary)}
.cal-cell.wk{color:var(--ink-soft)}
.cal-cell.sel.wk{color:var(--on-primary)}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 2px 4px;font-size:12px;color:var(--ink-soft);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.week-day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.week-day.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.week-day h4{margin:0 0 6px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.week-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.week-item i{width:9px;height:9px;border-radius:50%;flex:none}
.week-item.done span{text-decoration:line-through;opacity:.6}

/* ===================== MISSIONS ===================== */
.search{position:relative;flex:1}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.search input{padding-left:40px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.filter-btn{position:relative}
.filter-btn .n{position:absolute;top:-4px;right:-4px;background:var(--primary-ink);color:#fff;font-size:10px;font-weight:800;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters .btn{grid-column:1/-1}

/* ===================== SUBJECTS ===================== */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-card{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:104px}
.sub-card:active{transform:scale(.97)}
.sub-ico{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#3F3A45}
.sub-name{font-weight:800;font-size:14px;line-height:1.25}
.sub-meta{font-size:12px;color:var(--ink-soft)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--primary-ink);font-weight:800;padding:4px 0;margin-bottom:6px;cursor:pointer}
.note{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.note h4{margin:0;font-size:15.5px;font-weight:800}
.note p{white-space:pre-wrap;font-size:14px;margin-top:6px;word-break:break-word}
.note-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip{white-space:nowrap}

/* ===================== SETTINGS ===================== */
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:15px;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{transform:translateX(20px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.set-row .t{font-weight:800}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:54px;text-align:center;background:none;border:0;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-soft)}
.swatch i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--line);box-shadow:var(--shadow)}
.swatch.on i{border-color:var(--primary-ink)}
.swatch.on{color:var(--ink)}
.note-box{background:var(--lav);color:var(--lav-ink);border-radius:14px;padding:11px 13px;font-size:13px;margin-top:10px}
details.sched summary{font-weight:800;cursor:pointer;padding:6px 0}
.sched-day{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sched-day b{display:block}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.quick .btn{min-height:56px;font-size:15px;border-radius:18px}
.quick .btn.alt{background:var(--surface);border:1.5px solid var(--line)}
</style>
</head>
<body>

<div class="app"><main id="view"></main></div>

<button class="fab" id="fab" data-act="open-add" aria-label="Tambah kegiatan"></button>
<nav class="nav" id="nav" aria-label="Navigasi utama"></nav>

<div class="overlay" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="overlay" id="dialog"><div class="dialog" id="dialogBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript>LUMI membutuhkan JavaScript agar bisa berjalan.</noscript>

<script>
(function(){
'use strict';

/* =====================================================================

// Merapikan / memvalidasi data (dipakai saat load & import)
function migrate(raw){
  const d=defaultState();
  if(!raw||typeof raw!=='object') return d;
  const out=d;
  if(raw.profile&&typeof raw.profile==='object'){
    out.profile.name=String(raw.profile.name||'').slice(0,40);
    out.profile.kelas=String(raw.profile.kelas||d.profile.kelas).slice(0,20);
    if(out.profile.kelas==='XI-2S') out.profile.kelas='XI-2'; // koreksi default lama
  }
  if(raw.settings&&typeof raw.settings==='object'){
    if(['cream','blue','sage','lavender','night'].indexOf(raw.settings.theme)>=0) out.settings.theme=raw.settings.theme;
    out.settings.notifEnabled=!!raw.settings.notifEnabled;
    if(/^\d{2}:\d{2}$/.test(raw.settings.notifTime||'')) out.settings.notifTime=raw.settings.notifTime;
  }
  if(raw.schedule&&typeof raw.schedule==='object'){
    const s={};let ok=true;
    for(let i=1;i<=5;i++){
      const arr=raw.schedule[i];
      if(!Array.isArray(arr)){ok=false;break;}
      s[i]=arr.filter(x=>x&&typeof x.s==='string').map(x=>({s:x.s,h:Number(x.h)||1}));
    }
    if(ok) out.schedule=s;
  }
  if(raw.pulang&&typeof raw.pulang==='object') out.pulang=Object.assign({},out.pulang,raw.pulang);
  if(Array.isArray(raw.activities)){
    out.activities=raw.activities.filter(a=>a&&a.id&&a.type&&a.subject&&isKey(a.date)).map(a=>({
      id:String(a.id),type:String(a.type),subject:String(a.subject),date:a.date,
      detail:String(a.detail||''),deadline:isKey(a.deadline)?a.deadline:'',
      priority:PRIORITIES.indexOf(a.priority)>=0?a.priority:'Biasa',
      status:STATUSES.indexOf(a.status)>=0?a.status:'Belum dikerjakan',
      reminders:Array.isArray(a.reminders)?a.reminders.filter(r=>REMINDERS.some(x=>x.id===r)):[],
      customDays:Number.isFinite(Number(a.customDays))?Number(a.customDays):2,
      completedAt:isKey(a.completedAt)?a.completedAt:'',
      created:isKey(a.created)?a.created:todayKey()
    }));
  }
  if(Array.isArray(raw.notes)){
    out.notes=raw.notes.filter(n=>n&&n.id&&n.subject&&n.title).map(n=>({
      id:String(n.id),subject:String(n.subject),
      cat:NOTE_CATS.some(c=>c.id===n.cat)?n.cat:'catatan',
      title:String(n.title),body:String(n.body||''),
      created:isKey(n.created)?n.created:todayKey(),updated:isKey(n.updated)?n.updated:todayKey(),
      review:(n.review&&n.review.on)?{
        on:true,idx:Math.max(0,Math.min(4,Number(n.review.idx)||0)),
        nextDue:isKey(n.review.nextDue)?n.review.nextDue:todayKey(),
        history:Array.isArray(n.review.history)?n.review.history.filter(isKey):[]
      }:null
    }));
  }
  if(raw.notified&&typeof raw.notified==='object') out.notified=raw.notified;
  return out;
}

const dueOf  = a=>a.deadline||a.date;
const isDone = a=>a.status==='Selesai';
const prioRank = a=>PRIORITIES.indexOf(a.priority);
// Kelompok misi: today / upcoming / overdue / completed
function bucket(a){
  if(isDone(a)) return 'completed';
  const t=todayKey(), due=dueOf(a);
  if(due<t) return 'overdue';
  if(a.date===t||due===t) return 'today';
  return 'upcoming';
}
function actTitle(a){return a.type+' '+a.subject;}
function lessonsOf(k){return S.schedule[parseKey(k).getDay()]||[];}
function itemsOn(k){
  const out=[];
  S.activities.forEach(a=>{
    if(a.date===k) out.push({a:a,kind:'date'});
    else if(a.deadline&&a.deadline===k) out.push({a:a,kind:'deadline'});
  });
  return out.sort((x,y)=>prioRank(y.a)-prioRank(x.a));
}

/* ---------- Spaced repetition (catatan mapel) ---------- */
function reviewInfo(n){
  if(!n.review||!n.review.on) return null;
  if(n.review.idx>=REVIEW_STEPS.length) return {finished:true};
  return {finished:false,step:REVIEW_STEPS[n.review.idx],due:n.review.nextDue};
}
function dueReviews(){
  const t=todayKey();
  return S.notes.map(n=>({n:n,info:reviewInfo(n)}))
    .filter(x=>x.info&&!x.info.finished&&x.info.due<=t)
    .sort((a,b)=>a.info.due.localeCompare(b.info.due));
}
function reviewsDoneToday(){
  const t=todayKey();
  return S.notes.filter(n=>n.review&&n.review.history&&n.review.history.indexOf(t)>=0);
}
function markReviewed(id){
  const n=S.notes.find(x=>x.id===id); if(!n||!n.review) return;
  const t=todayKey(), r=n.review;
  r.history.push(t);
  const prev=REVIEW_STEPS[r.idx];
  r.idx++;
  if(r.idx<REVIEW_STEPS.length) r.nextDue=addDays(t,REVIEW_STEPS[r.idx]-prev); // jarak antar review dijaga dari hari review sebenarnya
  save();
  toast(r.idx>=REVIEW_STEPS.length?'Semua tahap review selesai!':'Review tercatat. Berikutnya H+'+REVIEW_STEPS[r.idx]);
  refresh();
}

/* =====================================================================
   6. PLANNER  (rekomendasi berbasis aturan — BUKAN AI sungguhan)
   Struktur disiapkan agar nanti bisa diganti AI API:
     - Planner.buildPayload(state) -> data JSON yang bisa dikirim ke API
     - Planner.engines.rules       -> mesin saat ini (lokal, tanpa internet)
     - Tambahkan Planner.engines.api = async payload => {...} untuk AI nyata
   ===================================================================== */
const Planner = {
  LEAD:{Ulangan:7,Kuis:3,Remedial:5,Presentasi:5,Praktikum:3,Proyek:7,Deadline:2,Tugas:2,PR:1,Revisi:2},
  TYPEW:{Ulangan:3,Kuis:2,Remedial:2.5,Presentasi:2,Praktikum:1.5,Proyek:1.5,Deadline:2,Tugas:1,PR:1,Revisi:1},
  PRIOW:{'Biasa':0,'Penting':1.5,'Sangat penting':3},
  GENERIC:['Baca ulang catatan dan ringkasan','Kerjakan latihan soal','Ulangi bagian yang belum dipahami'],
  buildPayload(state){
    return {today:todayKey(),
      activities:state.activities.filter(a=>a.status!=='Selesai'),
      notes:state.notes.map(n=>({subject:n.subject,cat:n.cat,title:n.title}))};
  },
  engines:{
    rules(state,today){
      const items=[];
      state.activities.forEach(a=>{
        if(a.status==='Selesai') return;
        const due=a.deadline||a.date, days=diffDays(due,today);
        let urgency = days<0?12 : days===0?10 : days<=1?8 : days<=3?6 : days<=7?4 : days<=14?2 : 1;
        const score = urgency + (Planner.PRIOW[a.priority]||0) + (Planner.TYPEW[a.type]||0.5);
        const level = days<0?'Terlambat' : score>=11?'Prioritas tinggi' : score>=7?'Prioritas sedang':'Santai';
        const lead = Planner.LEAD[a.type];
        const startDate = lead!=null?addDays(due,-lead):null;
        const item={a:a,due:due,days:days,score:score,level:level,startDate:startDate,
          startNow:startDate!=null&&startDate<=today&&days>=0,targets:[],unclear:[]};
        if(lead!=null&&days>=0) Planner.fillTargets(item,state,today);
        items.push(item);
      });
      items.sort((x,y)=>y.score-x.score||x.due.localeCompare(y.due));
      return items;
    }
  },
  fillTargets(item,state,today){
    const a=item.a, due=item.due;
    const start = item.startDate>today?item.startDate:today;
    let days=[];
    for(let k=start;k<due;k=addDays(k,1)) days.push(k);
    if(!days.length) days=[today]; // jatuh tempo hari ini / besok
    if(days.length>7) days=days.slice(0,7);
    const topics=String(a.detail||'').split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
    item.unclear=state.notes.filter(n=>n.subject===a.subject&&n.cat==='belum').map(n=>n.title);
    const m=days.length;
    if(m===1){
      item.targets.push({date:days[0],text:(topics.length?'Pelajari: '+topics.join(', ')+'. ':'')+'Ringkas materi lalu kerjakan latihan soal.'});
      return;
    }
    const work=m-1, T=topics.length;
    for(let i=0;i<work;i++){
      const chunk=T?topics.slice(Math.floor(i*T/work),Math.floor((i+1)*T/work)):[];
      item.targets.push({date:days[i],text:chunk.length?'Pelajari: '+chunk.join(', '):Planner.GENERIC[i%Planner.GENERIC.length]});
    }
    let last='Ulangi rumus/poin penting dan latihan soal terakhir';
    if(item.unclear.length) last+='. Fokus ke: '+item.unclear.slice(0,3).join(', ');
    item.targets.push({date:days[m-1],text:last});
  },
  run(state,engine){return Planner.engines[engine||'rules'](state,todayKey());}
};

/* =====================================================================
   7. NOTIFIKASI & PENGINGAT
   - Pengingat dashboard selalu tampil (tidak butuh izin).
   - Notifikasi browser hanya muncul saat LUMI sedang dibuka.
   - Untuk notifikasi saat browser/aplikasi tertutup: PWA push atau
     Capacitor Local Notifications (lihat PANDUAN.md). Adapter ada di Notifier.
   ===================================================================== */
const Notifier = {
  supported(){return typeof window!=='undefined'&&'Notification' in window;},
  permission(){return Notifier.supported()?Notification.permission:'unsupported';},
  canShow(){return Notifier.permission()==='granted';},
  request(){
    return new Promise(function(res){
      if(!Notifier.supported()) return res('unsupported');
      try{
        const r=Notification.requestPermission(function(p){res(p);});
        if(r&&typeof r.then==='function') r.then(res,function(){res('denied');});
      }catch(e){res('denied');}
    });
  },
  // Mengembalikan Promise<boolean>. Di Android Chrome, "new Notification" tidak didukung;
  // notifikasi sistem butuh service worker (PWA). Jika gagal -> false, dan UI memakai toast.
  async show(title,body,tag){
    if(!Notifier.canShow()) return false;
    try{
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.getRegistration();
        if(reg&&reg.showNotification){await reg.showNotification(title,{body:body,tag:tag});return true;}
      }
    }catch(e){}
    try{new Notification(title,{body:body,tag:tag});return true;}catch(e){return false;}
  }

};
function reminderOffsets(a){
  const out=[];
  (a.reminders||[]).forEach(function(r){
    if(r==='H0') out.push(0); else if(r==='H1') out.push(1);
    else if(r==='H3') out.push(3); else if(r==='H7') out.push(7);
    else if(r==='custom'&&Number(a.customDays)>=0) out.push(Number(a.customDays));
  });
  return out;
}
// Pengingat untuk dashboard: satu baris per kegiatan (tanpa duplikat)
function inAppReminders(){
  const t=todayKey(), res=[];
  S.activities.forEach(function(a){
    if(isDone(a)) return;
    const days=diffDays(dueOf(a),t);
    if(days<0) return;
    if(reminderOffsets(a).some(function(o){return o>=days;})) res.push({a:a,days:days});
  });
  return res.sort((x,y)=>x.days-y.days);
}
// Dicek berkala saat aplikasi terbuka
function checkNotifications(){
  if(!S.settings.notifEnabled||!Notifier.canShow()) return;
  const n=new Date(), t=todayKey(), hm=pad(n.getHours())+':'+pad(n.getMinutes());
  if(hm<S.settings.notifTime) return;
  let changed=false;
  Object.keys(S.notified).forEach(function(k){ if(k.slice(-10)!==t){delete S.notified[k];changed=true;} });
  S.activities.forEach(function(a){
    if(isDone(a)) return;
    const due=dueOf(a);
    reminderOffsets(a).forEach(function(off){
      if(addDays(due,-off)!==t) return;
      const key=a.id+'|'+off+'|'+t;
      if(S.notified[key]) return;          // anti notifikasi ganda
      S.notified[key]=1;changed=true;
      const body=(off===0?'Hari ini! ':off+' hari lagi. ')+(a.detail?a.detail.split('\n')[0].slice(0,80):fmtShort(due));
      Notifier.show('LUMI · '+actTitle(a),body,key);
    });
  });
  if(changed) save();
}

    $('#dialogBody').innerHTML='<h3>'+esc(o.title)+'</h3><p>'+esc(o.text)+'</p><div class="sheet-actions"><button class="btn" data-dlg="0">Batal</button><button class="btn danger" data-dlg="1">'+esc(o.ok||'Ya')+'</button></div>';

function chipValues(form,group){
  return $$('.chip.on[data-group="'+group+'"]',form).map(function(c){return c.dataset.value;});
}
function saveActForm(form){
  const err=function(m){$('#fErr').innerHTML='<div class="err">'+esc(m)+'</div>';};
  const type=chipValues(form,'type')[0], subject=$('#fSubject').value, date=$('#fDate').value, deadline='';
  const old=form.dataset.id?S.activities.find(function(x){return x.id===form.dataset.id;}):null;
  const priority=old?old.priority:'Biasa', status=old?old.status:'Belum dikerjakan';
  const reminders=chipValues(form,'reminders');
  const customDays=2;
  if(!type) return err('Pilih jenis kegiatan.');
  if(!subject) return err('Pilih mata pelajaran.');
  if(!isKey(date)) return err('Pilih tanggal kegiatan.');
  if(deadline&&!isKey(deadline)) return err('Format deadline tidak valid.');
  if(deadline&&deadline<date) return err('Deadline tidak boleh sebelum tanggal kegiatan.');
  const id=form.dataset.id, t=todayKey();
  let a=id?S.activities.find(function(x){return x.id===id;}):null;
  if(!a){a={id:uid(),created:t,completedAt:''};S.activities.push(a);}
  const wasDone=a.status==='Selesai';
  Object.assign(a,{type:type,subject:subject,date:date,deadline:deadline,detail:$('#fDetail').value.trim(),priority:priority,status:status,reminders:reminders,customDays:customDays});
  if(status==='Selesai'&&!wasDone) a.completedAt=t;
  if(status!=='Selesai') a.completedAt='';
  save();closeSheet();toast(id?'Perubahan disimpan':'Kegiatan ditambahkan');
  ui.calSel=date;const d=parseKey(date);ui.calMonth={y:d.getFullYear(),m:d.getMonth()};
  refresh();
}

  const a=S.activities.find(function(x){return x.id===id;}); if(!a) return;
  const was=a.status==='Selesai';
  a.status=status;
  a.completedAt=status==='Selesai'?(was&&a.completedAt?a.completedAt:todayKey()):'';
  save();
}

    row('Pengingat',rem.length?esc(rem.join(', ')):'Tidak ada')+
    '<label class="lbl">Ubah status</label><div class="chips">'+STATUSES.map(function(s){return '<button class="chip'+(a.status===s?' on':'')+'" data-act="set-status" data-id="'+a.id+'" data-status="'+s+'">'+s+'</button>';}).join('')+'</div>'+
    '<div class="sheet-actions"><button class="btn primary" data-act="edit-act" data-id="'+a.id+'">'+icon('edit',16)+'Edit</button><button class="btn danger" data-act="del-act" data-id="'+a.id+'">'+icon('trash',16)+'Hapus</button></div>');

function openPlanner(){

/* =====================================================================
   16. EVENT (delegasi): satu listener untuk semua tombol
   ===================================================================== */
document.addEventListener('click',function(e){
  if(e.target.id==='sheet'){closeSheet();return;}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'nav': goTab(el.dataset.tab);break;
    case 'open-add': openActForm(null,{date:el.dataset.date||(ui.tab==='calendar'?ui.calSel:todayKey()),subject:el.dataset.subject||'',type:el.dataset.type||''});break;
    case 'close-sheet': closeSheet();break;
    case 'chip': {
      const grp=el.dataset.group, multi=el.parentNode.dataset.multi==='1';
      if(multi) el.classList.toggle('on');
      else if(el.dataset.act==='chip'&&!el.classList.contains('on')){$$('.chip[data-group="'+grp+'"]',el.parentNode).forEach(function(c){c.classList.remove('on');});el.classList.add('on');}
      if(grp==='type'){const want=EXAM_TYPES.indexOf(el.dataset.value)>=0?['H7','H3','H1']:['H1'];$$('.chip[data-group="reminders"]').forEach(function(c){c.classList.toggle('on',want.indexOf(c.dataset.value)>=0);});}
      if(grp==='reminders'){const cw=$('#customWrap');if(cw) cw.classList.toggle('hidden',!$('.chip.on[data-value="custom"]',el.parentNode));}
      break;}
    case 'toggle-act': {
      const a=S.activities.find(function(x){return x.id===id;}); if(!a) break;
      setStatus(id,isDone(a)?'Belum dikerjakan':'Selesai');
      if(isDone(a)) toastUndo(id); else toast('Ditandai belum selesai');
      refresh();break;}
    case 'undo-done': setStatus(id,'Belum dikerjakan');toast('Dibatalkan, tugas kembali aktif');refresh();break;
    case 'open-act': openActDetail(id);break;
    case 'set-status': setStatus(id,el.dataset.status);toast('Status diperbarui');refresh();openActDetail(id);break;
    case 'edit-act': openActForm(id);break;
    case 'del-act':
      confirmDialog({title:'Hapus kegiatan?',text:'Kegiatan ini akan dihapus permanen.',ok:'Hapus'}).then(function(ok){
        if(!ok) return;
        S.activities=S.activities.filter(function(x){return x.id!==id;});save();closeSheet();toast('Kegiatan dihapus');refresh();
      });break;
    case 'cal-view': ui.calView=el.dataset.view;render(false);break;
    case 'cal-today': ui.calSel=todayKey();{const d=new Date();ui.calMonth={y:d.getFullYear(),m:d.getMonth()};}render(false);window.scrollTo(0,0);break;
    case 'cal-prev': calShift(-1);render(false);break;
    case 'cal-next': calShift(1);render(false);break;
    case 'cal-sel': ui.calSel=el.dataset.date;render(false);break;
    case 'cal-sel-week': ui.calSel=el.dataset.date;ui.calView='month';{const d=parseKey(ui.calSel);ui.calMonth={y:d.getFullYear(),m:d.getMonth()};}render(false);break;
    case 'm-tab': ui.mTab=el.dataset.tab;renderMissionBody();break;
    case 'm-filter-toggle': ui.showFilters=!ui.showFilters;render(false);break;
    case 'm-filter-reset': ui.filters={subject:'',type:'',priority:'',status:''};render(false);break;
    case 'go-overdue': ui.mTab='overdue';goTab('missions');break;
    case 'subj-open': ui.subject=el.dataset.subject;ui.noteCat='all';render(true);window.scrollTo(0,0);break;
    case 'subj-back': ui.subject=null;render(true);window.scrollTo(0,0);break;
    case 'note-cat': ui.noteCat=el.dataset.cat;render(false);break;
    case 'note-add': openNoteForm(null);break;
    case 'note-edit': openNoteForm(id);break;
    case 'note-del':
      confirmDialog({title:'Hapus catatan?',text:'Catatan ini akan dihapus permanen.',ok:'Hapus'}).then(function(ok){
        if(!ok) return;
        S.notes=S.notes.filter(function(x){return x.id!==id;});save();toast('Catatan dihapus');refresh();
      });break;
    case 'review-done': markReviewed(id);break;
    case 'open-note': {
      const n=S.notes.find(function(x){return x.id===id;}); if(!n) break;
      ui.tab='subjects';ui.subject=n.subject;ui.noteCat='all';render(true);window.scrollTo(0,0);break;}
    case 'open-planner': openPlanner();break;
    case 'theme-set': S.settings.theme=el.dataset.theme;save();render(false);break;
    case 'notif-request':
      Notifier.request().then(function(p){
        if(p==='granted'){S.settings.notifEnabled=true;save();toast('Notifikasi diizinkan');}
        else toast(p==='denied'?'Izin ditolak':'Notifikasi tidak tersedia');
        render(false);
      });break;
    case 'notif-test':
      if(!Notifier.canShow()){toast('Izinkan notifikasi dulu (atau browser tidak mendukung)');break;}
      Notifier.show('LUMI','Notifikasi berfungsi. Pengingat muncul saat LUMI terbuka.','lumi-test').then(function(ok){
        toast(ok?'Notifikasi tes dikirim':'Browser ini belum bisa menampilkan notifikasi sistem. Pengingat tetap tampil di dashboard.');
      });break;
    case 'export': exportData();break;
    case 'import': $('#importFile').click();break;
    case 'reset':
      confirmDialog({title:'Reset semua data?',text:'Semua kegiatan, catatan, dan pengaturan akan dihapus dan tidak bisa dikembalikan. Disarankan export data dulu.',ok:'Reset'}).then(function(ok){
        if(!ok) return;
        Storage.clear();S=defaultState();save();ui.subject=null;ui.q='';ui.filters={subject:'',type:'',priority:'',status:''};
        toast('Data direset');render(true);
      });break;
  }
});

document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='actForm') saveActForm(e.target);
  else if(e.target.id==='noteForm') saveNote(e.target);
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='mSearch'){ui.q=t.value;renderMissionBody();}
  else if(t.id==='pName'){S.profile.name=t.value.slice(0,40);save();}
  else if(t.id==='pClass'){S.profile.kelas=t.value.slice(0,20);save();}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.filter){ui.filters[t.dataset.filter]=t.value;render(false);}
  else if(t.id==='notifTime'){if(/^\d{2}:\d{2}$/.test(t.value)){S.settings.notifTime=t.value;save();toast('Jam pengingat disimpan');}}
  else if(t.id==='notifSwitch'){
    if(!t.checked){S.settings.notifEnabled=false;save();render(false);return;}
    if(!Notifier.supported()){t.checked=false;toast('Browser tidak mendukung notifikasi. Pengingat tampil di dashboard.');return;}
    if(Notifier.permission()==='granted'){S.settings.notifEnabled=true;save();toast('Notifikasi aktif');return;}
    if(Notifier.permission()==='denied'){t.checked=false;toast('Izin ditolak. Ubah di pengaturan situs browser.');return;}
    Notifier.request().then(function(p){
      S.settings.notifEnabled=(p==='granted');save();
      toast(p==='granted'?'Notifikasi aktif':'Izin tidak diberikan');render(false);
    });
  }
  else if(t.id==='importFile'){importData(t);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape') closeSheet();});

/* =====================================================================
   17. EXPORT / IMPORT
   ===================================================================== */
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='lumi-backup-'+todayKey()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    toast('Data diekspor ke file JSON');
  }catch(e){toast('Export gagal di browser ini');}
}
function importData(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=function(){
    input.value='';
    let obj;
    try{obj=JSON.parse(String(r.result));}catch(e){toast('File bukan JSON yang valid');return;}
    if(!obj||typeof obj!=='object'||!Array.isArray(obj.activities)||!Array.isArray(obj.notes)){toast('Format file bukan cadangan LUMI');return;}
    const next=migrate(obj);
    confirmDialog({title:'Import data?',text:'Data saat ini akan diganti dengan isi file ('+next.activities.length+' kegiatan, '+next.notes.length+' catatan).',ok:'Import'}).then(function(ok){
      if(!ok) return;
      S=next;save();toast('Data berhasil diimport');render(true);
    });
  };
  r.onerror=function(){input.value='';toast('Gagal membaca file');};
  r.readAsText(file);
}

/* =====================================================================
   18. INISIALISASI
   ===================================================================== */
let lastDay=todayKey();
function tick(){
  checkNotifications();
  if(todayKey()!==lastDay){ // ganti hari saat aplikasi terbuka
    lastDay=todayKey();
    if(ui.calSel<lastDay&&ui.tab!=='calendar') ui.calSel=lastDay;
    if(!sheetOpen) refresh();
  }
}
document.addEventListener('visibilitychange',function(){if(!document.hidden) tick();});
setInterval(tick,30000);

if(ENABLE_SERVICE_WORKER&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}

render(true);
tick();
})();
</script>
